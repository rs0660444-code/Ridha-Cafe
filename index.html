<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Website | codingbyRidha</title>
</head>
<Style>
    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    body{
        background-color: #6c4319;
    }
    .section{
        padding: 2rem 9%;
    }
    .heading{
        text-align: center;
        font-size: 4rem;
        color: #230808;
        margin: 2rem 0;
    }
    .heading span{
        color: #340808;
    }
    .btn{
        display: inline-block;
        margin-top: 1rem;
        border-radius: 5rem;
        background-color: #6f151a;
        color: #8f536d;
        padding: 0.4rem 2rem;
        font-size: 1rem;
    }
    .btn:hover{
        background: #6c4319;
    }
    .header{
       background:#6c4319;
        display: flex;
        align-items: center;
        padding: 15px 30px;
        justify-content: space-between;
        box-shadow: 0 0.2rem 0.5rem 1rem rgb(23, 2, 2);
    }
    .header .logo{
        font-size: 2.8rem;
        font-weight: bold;
        color: #160303;
        text-decoration: none;
    }
    .header .logo span{
        color: #160303;
    }
    .header .navbar{
        display: flex;
        gap: 2.5rem;
    }
    .header .navbar a{
        font-size: 1.6rem;
        color: #0a0a0a;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
    }
    .header .navbar a:hover{
        color: #5f0f0f;
    }
    .hero-container{
        display:flex;
        align-items: center;
        justify-content: space-between;
        padding: 50px;
        min-height: 100vh;
    }  
    .hero-text{
        flex: 1;
        Max-width:50%;
    }
    .hero-text h3{
        font-size: 2.5rem;
        color: #110707;
    }
    .hero-text span{
        font-size: 2rem;
        color: rgb(20, 11, 1);
        display: block;
        padding: 1rem 0;
        line-height: 1.5;
    }
    .hero-text p{
        font-size: 1.5rem;
        color: rgb(18, 17, 17);
        padding: 1rem 0;
        line-height: 1.5;
    }
    .hero-image{
        flex: 1;
        display: flex;
        justify-content: center;
    }
    .hero-image img{
        max-width: 90%;
        height: 60%;
        border-radius: 10px;
    }
    

</Style>
<body>
    <header class="header">
        <a href="#" class="logo">🥤RiDha Cafe<span>'</span></a>
        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <section class="hero-container" id="home">
        <div class="hero-text">
            <h3>RiDha Cafe'</h3>
            <span>Where Every Sip Brings A Little Happiness !</span>
            <p>Welcome  to  RiDha Cafe', your cozy place for delicious coffee, good vibes and beautiful moment</p>
            <a href="#" class="btn">Order Now</a>
            <a href="#" class="btn">Contact Us</a>
        </div>
        <div class="hero-image">
        <img src="c:\Users\Anshika Singh\OneDrive\文档\cafe.jpeg" alt="RiDha Cafe Diagram">
        </div>
    </section>
   
</body>
</html>
