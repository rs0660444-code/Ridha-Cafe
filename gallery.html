<style>
    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    body{
        background-color: #6c4319;
    }
    .section{
        padding: 2rem 9%;
    }
    .header{
        background:#6c4319;
        padding:15px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 0.2rem 0.5rem 1rem rgb(23, 2, 2);
    }
    .header .logo{
        font-size: 2.8rem;
        font-weight: bold;
        color: #160303;
        text-decoration: none;
    }
    .header .logo span{
        color: #160303;
    }
    .header .navbar{
        display: flex;
        gap: 2.5rem;
    }
    .header .navbar a{
        font-size: 1.6rem;
        color: #0a0a0a;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
    }
    .header .navbar a:hover{
        color: #5f0f0f;
    }
    .gallery-section{
        padding: 50px 9%;
    }
    .gallery-section .gallery-list{
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        padding: 0;
    }
    .gallery-section .gallery-list .gallery-item{
        flex: 1 1 calc(33.333%-32px);
        border-radius: 10px;  
    }
    .gallery-section  .gallery-item .gallery-image{
        width: 100%;
        height: 250px;
        display: block;
    }
    .gallery-section  .gallery-item:hover .gallery-image{
        transform: scale(1.1);
    }
    .gallery-section .section-title{
        text-align: center;
        font-size: 2.5rem;
        color: #0f0e0e;
        margin-bottom: 2rem;
    }            
</style>
